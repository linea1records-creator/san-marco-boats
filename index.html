.brand b { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .01em; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.today { font-size: 13px; color: var(--muted); text-transform: capitalize; text-align: right; }
@media (max-width: 440px) { .today { display: none; } }
.outbtn { height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600; flex: none; }
.gear { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.gear[aria-current="page"] { border-color: var(--primary); color: var(--primary); }
.gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.logo .hull { fill: var(--hull, var(--brass)); }

/* main */
.main { flex: 1; min-height: 0; overflow-y: auto; padding-block: 18px 24px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface2); color: var(--ink); white-space: nowrap; }
.pill.go { background: var(--brass-bg); color: var(--brass); }
.pill.ok { background: var(--green-bg); color: var(--green); }
.pill.bad { background: var(--red-bg); color: var(--red); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 17px; width: 100%; text-decoration: none; text-align: center; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; font-size: 18px; min-height: 60px; }
.btn.danger { color: var(--red); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); min-height: 44px; font-size: 15px; }
.btn.sm { min-height: 44px; padding: 8px 14px; font-size: 15px; width: auto; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btns { display: flex; flex-direction: column; gap: 10px; }
.btns.two { flex-direction: row; }
.btns.two .btn { flex: 1; }

/* start screen */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 8px; }
.startbtn { position: relative; width: min(64vw, 232px); aspect-ratio: 1; border-radius: 50%; border: 0; background: var(--primary); color: var(--on-primary); --hull: var(--hullp); display: grid; place-items: center; margin: 10px 0 6px; box-shadow: 0 10px 28px rgba(6, 40, 46, .28); }
.startbtn .logo { width: 62%; height: 62%; }
.startbtn::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--primary); opacity: .5; animation: ring 2.6s ease-out infinite; pointer-events: none; }
@keyframes ring { from { transform: scale(.94); opacity: .6; } to { transform: scale(1.14); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .startbtn::after { animation: none; opacity: .3; } }
.hero p { max-width: 30ch; color: var(--muted); font-size: 17px; }
.stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat > div { background: var(--surface2); border-radius: 12px; padding: 12px; min-width: 0; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; font-family: var(--font-display); }
.stat span { font-size: 12px; color: var(--muted); }
.clock { font-family: var(--font-mono); font-size: 30px; font-variant-numeric: tabular-nums; }

/* lists */
.list { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; text-align: left; }
.item b { display: block; overflow-wrap: anywhere; }
.item small { color: var(--muted); display: block; overflow-wrap: anywhere; }
.item.hist { grid-template-columns: 56px minmax(0, 1fr) auto; }
.thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--surface2); display: block; }
.thumb.ph { display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.stl { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.stp { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
.stp:first-child { border-top: 0; }
.stp .mono { color: var(--primary); font-size: 15px; }
.stp b { font-weight: 600; overflow-wrap: anywhere; }
.stp small { display: block; color: var(--muted); }
.stp.now { background: var(--brass-bg); margin-inline: -8px; padding-inline: 8px; border-radius: 8px; border-top-color: transparent; }
.stp.past b { color: var(--muted); }

/* guide */
.instr { background: var(--surface2); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
.instr-g { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
.instr-g > div { min-width: 0; }
.instr .lbl { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.instr b { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 500; }
.instr small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.instr .gps { font-size: 12px; color: var(--muted); }
.steps { display: grid; gap: 6px; }
.steps div { font-size: 12px; font-weight: 600; color: var(--muted); border-top: 4px solid var(--line); padding-top: 6px; text-transform: uppercase; letter-spacing: .06em; }
.steps .done { border-color: var(--green); color: var(--green); }
.steps .now { border-color: var(--brass); color: var(--ink); }
.big { font-size: 22px; line-height: 1.3; font-weight: 500; overflow-wrap: anywhere; }
.huge { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; overflow-wrap: anywhere; }
.checks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.check { width: 100%; min-height: 56px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; }
.check i { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; font-style: normal; font-weight: 700; color: transparent; }
.check[aria-pressed="true"] { background: var(--green-bg); border-color: var(--green); }
.check[aria-pressed="true"] i { background: var(--green); border-color: var(--green); color: var(--surface); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.kv dt { color: var(--muted); font-size: 14px; }
.kv dd { margin: 0; overflow-wrap: anywhere; font-weight: 500; }
.note { background: var(--brass-bg); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.note b { color: var(--brass); }
.note.big { font-size: 20px; }

/* requests */
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cat { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.cat b { font-family: var(--font-display); font-size: 18px; line-height: 1.15; overflow-wrap: anywhere; }
.cat span { font-size: 13px; color: var(--muted); }
.cat.wide { grid-column: 1 / -1; min-height: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg button { min-height: 56px; padding: 6px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; line-height: 1.2; }
.seg button[aria-pressed="true"] { border: 2px solid var(--brass); background: var(--brass-bg); }
.seg button[aria-pressed="true"].u2 { border-color: var(--red); background: var(--red-bg); color: var(--red); }

/* contacts and docs */
.field { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; font-size: 18px; text-transform: uppercase; }
.field.txt { text-transform: none; font-size: 17px; resize: vertical; line-height: 1.4; }
.ct { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.ct > div:first-child { min-width: 0; flex: 1 1 160px; }
.ct b { display: block; overflow-wrap: anywhere; }
.ct small { color: var(--muted); display: block; }
.ct .mono { font-size: 17px; }
.ctb { display: flex; gap: 8px; }
.sos { border-color: var(--red); }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.doc > button { width: 100%; background: none; border: 0; text-align: left; padding: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; min-height: 60px; }
.doc > button b { display: block; overflow-wrap: anywhere; }
.doc .more { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }

/* QR */
.qr { background: #fff; padding: 8px; border-radius: 10px; line-height: 0; width: 100%; max-width: 168px; }
.qr svg { width: 100%; height: auto; display: block; }
.qrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.qrs .card { align-items: flex-start; }

/* nav */
.nav { border-top: 1px solid var(--line); background: var(--surface); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; padding-block: 6px 8px; }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 52px; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--primary); }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav .mid { color: var(--ink); }
.nav .mid .disc { width: 64px; height: 64px; border-radius: 50%; margin-top: -26px; background: var(--primary); color: var(--on-primary); --hull: var(--hullp); display: grid; place-items: center; border: 4px solid var(--surface); }
.nav .mid .disc .logo { width: 38px; height: 38px; }
.nav .mid[aria-current="page"] { color: var(--ink); }
.nav .mid[aria-current="page"] .disc { box-shadow: 0 0 0 3px var(--brass); }


/* rotella di navigazione */
.nav { position: fixed; left: calc(50% - 80px); bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: 160px; height: 160px; border: 0; background: none; z-index: 30; pointer-events: none; }
.nav .nav-in { display: block; max-width: none; margin: 0; padding: 0 !important; width: 160px; height: 160px; }
.dial { position: relative; width: 160px; height: 160px; pointer-events: none; touch-action: none; }
.dial::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.nav .ditem { position: absolute; width: 38px; height: 38px; min-height: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; background: none; border: 0; color: var(--muted); pointer-events: auto; }
.nav .ditem svg { width: 21px; height: 21px; }
.nav .ditem[aria-current="page"], .nav .ditem.pre { color: #fff; background: var(--primary); }
.nav .ditem.pre:not([aria-current="page"]) { background: var(--brass, var(--primary)); }
.knob { position: absolute; left: 50%; top: 50%; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: var(--primary); color: var(--on-primary, #fff); box-shadow: 0 3px 8px rgba(0,0,0,.3), inset 0 0 0 3px rgba(255,255,255,.18); display: grid; place-items: center; pointer-events: auto; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.knob.grab { cursor: grabbing; transform: scale(1.06); }
.knob span { position: relative; font-size: 10.5px; font-weight: 700; text-align: center; line-height: 1.05; max-width: 46px; pointer-events: none; }
.kd { position: absolute; inset: 0; transition: transform .18s ease-out; pointer-events: none; }
.kd i { position: absolute; left: 50%; top: 4px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #fff; }
body:not(.drive) .main { padding-bottom: 176px; }
body.drive:not(.drive-open) .nav { display: none; }



/* velocità: stili 5-9 */
.spv.sp5 svg { width: 100%; height: 100%; }
.spv.sp6 { padding: 0; position: relative; background: #0B2233; }
.spv.sp6 svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.spv.sp6 .wvn { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 4px; font-family: var(--font-mono); text-shadow: 0 2px 8px rgba(0,0,0,.6); }
.spv.sp6 .wvn b { font-size: min(26cqw, 40cqh); line-height: 1; } .spv.sp6 .wvn span { font-size: 12px; color: #CFE8F5; }
.spv.sp7 { flex-direction: row; gap: 14px; flex-wrap: wrap; }
.sem { display: flex; flex-direction: column; gap: 5px; padding: 6px; background: #05090B; border-radius: 12px; box-shadow: inset 0 0 0 1px #24343B; }
.sem i { width: min(14cqh, 26px); height: min(14cqh, 26px); border-radius: 50%; opacity: .18; }
.sem i.g { background: #43A047; } .sem i.y { background: #FFB300; } .sem i.r { background: #E53935; }
.sem i.on { opacity: 1; box-shadow: 0 0 14px currentColor; } .sem i.g.on { color: #43A047; } .sem i.y.on { color: #FFB300; } .sem i.r.on { color: #E53935; }
.spv.sp7 .sknot { width: 100%; text-align: center; margin-top: -4px; }
.spv.sp8 { justify-content: flex-start; align-items: stretch; gap: 0; padding: 6px 8px; }
.spv.sp8 .gtop { display: flex; justify-content: space-between; align-items: baseline; } .spv.sp8 .gmx { font-size: 11px; color: #8FA6AE; font-family: var(--font-mono); }
.spv.sp8 svg { flex: 1; min-height: 0; width: 100%; }
.spv.sp9 svg { width: 100%; flex: 1; min-height: 0; }

/* meteo + temperatura */
.wxv { container-type: size; width: 100%; background: #0E1A20; border-radius: 16px; box-shadow: inset 0 0 0 1px #24343B; overflow: hidden; color: #F2F7F5; }
.wxv > div { width: 100%; height: 100%; border-left: 5px solid #546E7A; padding: 4px 10px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.wxv .wxi { width: min(40cqh, 48px); height: min(40cqh, 48px); flex: none; }
.wxv .wtx { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; flex: 1; } .wxv .wtx b { font-size: 15px; } .wxv .wtx span, .wxv .wsm { font-size: 12px; color: #9FB4BB; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wxv .wtt { font-family: var(--font-mono); font-size: min(30cqh, 28px); }
.wxv .wxb { flex-direction: column; justify-content: center; align-items: flex-start; gap: 0; } .wxv .wbig { font-family: var(--font-mono); font-size: min(52cqh, 40px); line-height: 1; } .wxv .wrow { display: flex; align-items: center; gap: 6px; font-size: 14px; } .wxv .wrow .wxi { width: 26px; height: 26px; }
.wxv .wxc svg { height: 100%; width: auto; max-height: 90px; flex: none; }
.wxv .wxd svg { height: 100%; max-height: 72px; width: auto; flex: none; }
.wxv .wxe { gap: 10px; } .wxv .wnow { display: flex; align-items: center; gap: 4px; flex: none; }
.wxv .whrs { display: flex; flex: 1; justify-content: space-around; gap: 4px; min-width: 0; }
.wxv .wh { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #9FB4BB; } .wxv .wh .wxi { width: 26px; height: 26px; } .wxv .wh b { color: #F2F7F5; font-family: var(--font-mono); font-size: 13px; }
@container (max-width: 190px) { .wxv .wh.ex { display: none; } .wxv .wxe .wxi { width: 28px; height: 28px; } }
@container (max-height: 70px) { .wxv .wxb { flex-direction: row; align-items: center; gap: 8px; } .wxv .wsm { display: none; } }

/* marea */
.tdv { container-type: size; width: 100%; background: #0E1A20; border-radius: 16px; box-shadow: inset 0 0 0 1px #24343B; overflow: hidden; color: #F2F7F5; }
.tdw { height: 100%; border-left: 5px solid #546E7A; padding: 5px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tdh { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8FA6AE; } .tdl { font-weight: 700; text-transform: none; letter-spacing: 0; font-size: 12px; }
.tdr { display: flex; align-items: baseline; gap: 8px; } .tdv1 { font-family: var(--font-mono); font-size: min(28cqh, 30px); line-height: 1.05; } .tdv1 small { font-size: .45em; color: #8FA6AE; font-weight: 400; } .tdt { font-size: 13px; color: #CFE8F5; }
.tdc { flex: 1; min-height: 0; width: 100%; }
.tdx { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #CFE8F5; font-family: var(--font-mono); }
.tdm { font-size: 10px; color: #6F858D; }
.tdw > .tdn { font-size: 12px; color: #8FA6AE; }
@container (max-height: 80px) { .tdc, .tdm { display: none; } .tdx .ex { display: none; } }
@container (max-height: 60px) { .tdx { display: none; } }

/* Mimmo */
.mim { display: flex; width: 100%; gap: 8px; align-items: center; background: linear-gradient(180deg, #0E2A3A, #0E1A20); border-radius: 16px; box-shadow: inset 0 0 0 1px #24343B; padding: 8px; overflow: hidden; container-type: size; flex-direction: row; }
.mimd { flex: none; background: none; border: 0; padding: 0; width: min(38cqw, 90cqh, 150px); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mim .dol { width: 100%; height: auto; display: block; overflow: visible; }
.mim .dbob { animation: dbob 3.2s ease-in-out infinite; transform-origin: 100px 80px; }
.mim .djaw { transform-origin: 46px 86px; } .mim .deye { transform-origin: 59px 67px; animation: dblink 5s infinite; }
.mimd.talk .djaw { animation: djaw .22s ease-in-out infinite alternate; } .mimd.talk .dbob { animation-duration: 1.2s; }
@keyframes dbob { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-4px) rotate(1.5deg); } }
@keyframes djaw { from { transform: rotate(0); } to { transform: rotate(14deg); } }
@keyframes dblink { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.mimb { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: auto; background: #F2F7F5; color: #12202B; border-radius: 14px; padding: 6px 10px; font-size: 14px; line-height: 1.3; align-self: stretch; display: flex; flex-direction: column; gap: 2px; border-left: 5px solid #43A047; }
.mimb b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #3C86C2; }
.mimb.warn { border-left-color: #FFB300; } .mimb.bad { border-left-color: #E53935; background: #FFF1EF; }
@media (prefers-reduced-motion: reduce) { .mim .dbob, .mim .deye, .mimd.talk .djaw { animation: none; } }
/* Bebè Capitano: bambino a cartoni che dà le istruzioni e fa battute */
.bb { display: flex; }
.bb .mimd { width: min(34cqw, 95cqh, 140px); }
.bb .bbs { width: 100%; height: auto; display: block; overflow: visible; }
.bb .bbbob { animation: bbbob 2.6s ease-in-out infinite; transform-origin: 100px 120px; }
.bb .bbeye { transform-origin: 100px 92px; animation: dblink 4.2s infinite; }
.bb .bbmo { transform-origin: 100px 118px; } .bb .bbtg { transform-origin: 100px 120px; transform: scaleY(0); transition: transform .2s; }
.mimd.talk .bbmo { animation: bbtalk .2s ease-in-out infinite alternate; } .mimd.talk .bbbob { animation-duration: 1s; }
.mimd.joke .bbtg { transform: scaleY(1); } .mimd.joke .bbbob { animation: bbwig .5s ease-in-out 3; }
.bb .mimb b { color: #E0A400; } .bb .mimb.joke { border-left-color: #FFD23F; background: #FFFBEA; }

    if (probs) w.push(probs + (probs === 1 ? ' consegna con problema' : ' consegne con problema'));
    if (!d.gps_count) w.push('Nessun segnale GPS registrato in questo turno');
    else { if (noGps) w.push(noGps + (noGps === 1 ? ' consegna senza conferma GPS' : ' consegne senza conferma GPS') + ' (barca non rilevata vicino al punto)'); if (far) w.push(far + (far === 1 ? ' consegna segnata lontano dal punto' : ' consegne segnate lontano dal punto')); if (d.max_gap_min > 10) w.push('Segnale GPS perso per circa ' + d.max_gap_min + ' minuti'); }
    if (!d.has_plan) w.push('Turno senza piano tappe: manca il confronto con gli orari previsti');
    if (w.length) h += '<div class="note"><b>Da controllare</b><br>' + w.map(esc).join('<br>') + '</div>';
    h += '<div class="card" style="padding:10px">' + (d.track.length || st.length ? trackSvg(d.track, st) : '') + '<div class="muted" style="font-size:12px">Linea: percorso GPS. Numeri: tappe (verde fatte, rosso problema o non fatte, grigio da fare). ' + d.gps_count + ' punti GPS.</div></div>';
    if (!S.adminDemo && tok() && isEditor()) h += '<section class="card" style="display:flex;flex-direction:column;gap:8px"><b>Correggi errori</b><div class="muted">Se il turno è stato fatto per sbaglio o ha dati sbagliati.</div>' + (sh.voided ? '<button class="btn" data-act="shvoid" data-m="0" data-id="' + esc(sh.id) + '">Ripristina il turno</button>' : '<button class="btn danger" data-act="shvoid" data-m="1" data-id="' + esc(sh.id) + '">Annulla il turno</button>') + '<button class="btn danger" data-act="shvoid" data-m="2" data-id="' + esc(sh.id) + '">Elimina dalla cronologia</button></section>';
    h += '<h3>Consegne</h3>';
    st.forEach(function (z) {
      h += '<div class="card" style="gap:6px"><div class="row"><b>' + z.n + '. ' + esc(z.name) + '</b>' + statusText(z.status) + '</div>';
      h += '<div class="muted">' + (z.planned_t ? 'Previsto alle ' + esc(z.planned_t) : 'Orario da definire') + '</div>';
      if (z.done) {
        h += '<div>Segnata alle <b>' + fmtT(z.pressed_at) + '</b>' + (z.delay_min != null ? ' · ' + delayText(z.delay_min) : '') + '</div>';
        h += '<div>' + (z.gps_at ? 'GPS: arrivo alle <b>' + fmtT(z.gps_at) + '</b>' + (z.gps_delay_min != null ? ' · ' + delayText(z.gps_delay_min) : '') : '<span class="t-late">GPS: ' + (d.gps_count ? 'barca non rilevata vicino al punto' : 'nessun segnale') + '</span>') + '</div>';
        if (z.dist_press_m != null) h += '<div class="muted">Pulsante premuto a ' + z.dist_press_m + ' m dal punto' + (z.dist_press_m > (z.radius_m || 150) * 1.5 ? ' · <span class="t-late">lontano</span>' : '') + '</div>';
        if (z.reason) h += '<div>Motivo: <b>' + esc(z.reason) + '</b></div>';
      }
      h += '</div>';
    });
    return h + '</div>';
  }

  document.addEventListener('change', function (e) {
    if (e.target.id === 'fBoat') { adminF.boat = e.target.value; render(); }
    if (e.target.id === 'fWho') { adminF.who = e.target.value; render(); }
  });

  /* ---------- login con PIN ---------- */
  var PIN_HASH = { '7deb873d3d4c97f938f046c74473e1ed04c923ccff86b7fa86e81649251624ee': 'admin', '57570274e6c74913e66a9da78045e96590980ec4523589c65f06233ac950b353': 'crew' };
  var SKEY = 'smb-session', LKEY = 'smb-lock', SESSION = null, pinBuf = '', loginStep = 'pin', loginErr = '';
  try { var rs = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (rs && rs.name && Date.now() - rs.t < 12 * 3600 * 1000) SESSION = rs; } catch (e) {}
  if (SESSION && !SESSION.token && !SESSION.offline) SESSION = null;
  function lockLeft() { try { var l = JSON.parse(localStorage.getItem(LKEY) || '{}'); return Math.max(0, Math.ceil(((l.until || 0) - Date.now()) / 1000)); } catch (e) { return 0; } }
  function failPin() {
    var l = {}; try { l = JSON.parse(localStorage.getItem(LKEY) || '{}'); } catch (e) {}
    l.n = (l.n || 0) + 1; if (l.n >= 5) { l.n = 0; l.until = Date.now() + 30000; }
    try { localStorage.setItem(LKEY, JSON.stringify(l)); } catch (e) {}
  }
  function sha(pin) {
    if (!(window.crypto && crypto.subtle)) return Promise.reject(new Error('nocrypto'));
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode('smb:' + pin)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  function drawLogin() {
    var el = $('login'), app = $('app');
    if (SESSION) { el.hidden = true; app.hidden = false; return; }
    app.hidden = true; el.hidden = false;
    if (loginStep === 'name') {
      var names = loginNames.length ? loginNames : boatCodes().map(function (k) { return BOATS[k].crew; }).filter(Boolean);
      el.innerHTML = '<h1>Chi sei?</h1><p>Scegli il tuo nome</p><div class="who">' + names.map(function (n) { return '<button data-n="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div><button class="link" id="lgBack">Indietro</button>';
      el.querySelectorAll('.who button').forEach(function (b) { b.onclick = function () { pickName(b.getAttribute('data-n')); }; });
      $('lgBack').onclick = function () { loginStep = 'pin'; pinBuf = ''; loginPin = ''; loginNames = []; loginOffline = false; loginErr = ''; drawLogin(); };
      return;
    }
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
    el.innerHTML = '<div id="brandLg"></div><h1>San Marco Boat</h1><p>Inserisci il tuo PIN</p>' +
      '<div class="dots" id="lgDots">' + pinBuf.split('').map(function () { return '<i></i>'; }).join('') + '</div>' +
      '<div class="err" id="lgErr">' + esc(loginErr) + '</div>' +
      '<div class="pad">' + keys.map(function (k) { return k ? '<button data-k="' + k + '">' + k + '</button>' : '<span></span>'; }).join('') + '</div>' +
      '<button class="go" id="lgGo">Entra</button>';
    $('brandLg').innerHTML = logo(56);
    el.querySelectorAll('.pad button').forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-k'); loginErr = '';
        if (k === '⌫') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 8) pinBuf += k;
        $('lgDots').innerHTML = pinBuf.split('').map(function () { return '<i></i>'; }).join(''); $('lgErr').textContent = '';
      };
    });
    $('lgGo').onclick = submitPin;
  }
  function localLogin(pin) {
    sha(pin).then(function (hx) {
      var role = PIN_HASH[hx]; pinBuf = '';
      if (!role) { failPin(); loginErr = 'PIN non corretto.'; drawLogin(); return; }
      try { localStorage.removeItem(LKEY); } catch (e) {}
      loginOffline = true;
      if (role === 'admin') enter('admin', 'Admin', null, true); else { loginPin = ''; loginStep = 'name'; loginErr = ''; drawLogin(); }
    }).catch(function () { loginErr = 'Il PIN funziona solo su una pagina https.'; drawLogin(); });
  }
  function handleLogin(r) {
    pinBuf = '';
    if (r && r.token && r.role === 'customer') { try { localStorage.setItem('smb-cust', JSON.stringify({ t: r.token, n: r.name })); } catch (e) {} location.reload(); return; }
    if (r && r.token) { loginPin = ''; enter(r.role, r.name, r.token, false); return; }
    if (r && r.names) { loginNames = r.names; loginStep = 'name'; loginErr = ''; drawLogin(); return; }
    loginPin = ''; loginErr = (r && r.error === 'bloccato') ? 'Troppi tentativi. Riprova tra qualche minuto.' : 'PIN non corretto.'; drawLogin();
  }
  function submitPin() {
    var w = lockLeft(); if (w > 0) { loginErr = 'Troppi tentativi. Riprova tra ' + w + ' secondi.'; $('lgErr').textContent = loginErr; return; }
    if (pinBuf.length < 4) { loginErr = 'Il PIN ha almeno 4 cifre.'; $('lgErr').textContent = loginErr; return; }
    var pin = pinBuf; loginPin = pin; loginOffline = false;
    $('lgErr').textContent = 'Controllo il PIN…';
    cloud('rpc_login', { p_pin: pin, p_name: null, p_device: DEV }).then(handleLogin).catch(function (e) {
      if (e && e.api) { pinBuf = ''; loginErr = 'Errore del server. Riprova.'; drawLogin(); return; }
      localLogin(pin);
    });
  }
  function pickName(n) {
    if (loginOffline) { enter('crew', n, null, true); return; }
    cloud('rpc_login', { p_pin: loginPin, p_name: n, p_device: DEV }).then(handleLogin).catch(function () { loginErr = 'Connessione assente. Riprova.'; loginStep = 'pin'; drawLogin(); });
  }
  function enter(role, name, token, offline) {
    SESSION = { role: role, name: name, t: Date.now(), token: token || null, offline: !!offline };
    try { localStorage.setItem(SKEY, JSON.stringify(SESSION)); } catch (e) {}
    loginStep = 'pin'; pinBuf = ''; loginErr = ''; loginNames = []; view = S.shift ? 'turno' : 'home';
    drawLogin(); render(); gpsApply(); loadContacts(); loadAdmin(); loadMyTasks(); loadBoatInfo(); loadMe().then(function (ch) { if (ch) { render(); loadAdmin(); } loadNotif(); Promise.all([loadProgram(), loadAsg()]).then(briefMaybe); sendPendingReqs(); pushInit(); loadDdt(); if (isOff()) loadXT().then(render); }); MG.opts = null; MG.list = null; MG.draft = null; MG.fleet = null;
  }
  function logout() {
    if (S.shift && !confirm('Hai un turno ancora aperto. Vuoi uscire dal profilo lo stesso?')) return;
    if (tok()) { cloud('rpc_logout', { p_token: tok() }).catch(function () {}); }
    CLOUDADM = null;
    SESSION = null; try { localStorage.removeItem(SKEY); } catch (e) {}
    gpsStop(); loginStep = 'pin'; pinBuf = ''; drawLogin();
  }
  document.addEventListener('keydown', function (e) {
    if (SESSION || loginStep !== 'pin') return;
    if (/^[0-9]$/.test(e.key) && pinBuf.length < 8) { pinBuf += e.key; drawLogin(); }
    else if (e.key === 'Backspace') { pinBuf = pinBuf.slice(0, -1); drawLogin(); }
    else if (e.key === 'Enter') submitPin();
  });

  setInterval(function () { var c = $('clock'); if (c && S.shift) c.textContent = dur(Date.now() - S.shift.start); }, 1000);
  if (CUSTTOK) { custBoot(); return; }
  drawLogin();
  if (SESSION && !S.shift) view = 'home';
  if (SESSION && SESSION.role === 'office') view = 'home';
  if (SESSION) gpsApply();
  render();
  if (SESSION) { loadContacts(); loadAdmin(); loadBoatInfo(); loadMe().then(function (ch) { if (ch) { render(); loadAdmin(); } loadNotif(); Promise.all([loadProgram(), loadAsg()]).then(briefMaybe); sendPendingReqs(); pushInit(); loadDdt(); if (isOff()) loadXT().then(render); }); }
  if (SESSION && view === 'logistica' && isMgr()) setTimeout(function () { loadMgr(false); }, 400);
  updCheck(); setTimeout(midnightCheck, 1500); setTimeout(briefMaybe, 1200);
})();
</script>

</body></html>
